<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>██████</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="noise"></div>
<div id="vignette"></div>

<!-- Стартовый экран -->
<section id="start-screen" class="screen active">
  <h1 class="glitch" data-text="ТЫ НЕ ДОЛЖЕН БЫЛ ЭТО ОТКРЫВАТЬ">ТЫ НЕ ДОЛЖЕН БЫЛ ЭТО ОТКРЫВАТЬ</h1>
  <p class="whisper">Оно уже знает, что ты здесь...</p>
  <button id="start-btn" class="btn">НАЧАТЬ</button>
  <p class="hint">🎧 Надень наушники. Выключи свет. Не оборачивайся.</p>
</section>

<!-- Игровой экран -->
<section id="game-screen" class="screen">
  <div id="room">
    <p id="story"></p>
    <div id="choices"></div>
  </div>
  <div id="inventory">
    <span>Ключи: <b id="keys-count">0</b>/4</span>
  </div>
</section>

<!-- Экран скримера -->
<div id="screamer" class="hidden">
  <img id="screamer-img" src="" alt="">
</div>

<!-- Экран смерти -->
<section id="death-screen" class="screen">
  <h2 class="glitch" data-text="ОНО НАШЛО ТЕБЯ">ОНО НАШЛО ТЕБЯ</h2>
  <button id="retry-btn" class="btn">ПОПРОБОВАТЬ СНОВА</button>
</section>

<!-- Финальный экран -->
<section id="end-screen" class="screen">
  <h2>ТЫ ОТКРЫЛ ДВЕРЬ...</h2>
  <p class="whisper">Но дверь была не выходом. Это был вход.</p>
  <p class="whisper small">Теперь ты — часть этого места. Спасибо, что поиграл.</p>
</section>

<audio id="ambient" loop>
  <source src="assets/ambient.mp3" type="audio/mpeg">
</audio>
<audio id="scream-sound">
  <source src="assets/scream.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>
</body>
</html>
